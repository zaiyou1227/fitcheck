<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6f4a">
<meta name="robots" content="noindex, nofollow">
<title>恢复尺码数据 · 尺码助手</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="wrap">

  <div class="page-head">
    <h1>从链接恢复数据</h1>
    <p class="lede">这条链接里带着一份身体尺寸数据。确认无误后点「导入到本机」，
      就会存进当前浏览器。</p>
  </div>

  <div id="app">
    <div class="card">
      <h2>正在读取 <span class="tag">请稍候</span></h2>
      <p class="hint">如果你的浏览器很旧，可能会读到空数据。</p>
    </div>
  </div>

</div>

<script src="js/vendor-lz-string.min.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
(function () {
  "use strict";
  var D = DachuData;
  var UIx = UI;

  var app = document.getElementById("app");
  var hash = location.hash ? location.hash.slice(1) : "";
  var data = D.decodeShare(hash);

  function render(data) {
    if (!data) {
      app.innerHTML =
        '<div class="card">' +
          '<h2>没有读到数据</h2>' +
          '<p class="hint">链接可能不完整（被截断、或复制时少了后半段）。</p>' +
          '<div class="note-box warn">' +
            '请让对方重新生成一次分享链接。<b>微信里点开链接时，注意别只复制到前半截。</b>' +
          '</div>' +
          '<div class="btnrow"><a class="btn ghost" href="profile.html">回尺码档案</a></div>' +
        '</div>';
      return;
    }

    // 本地已有数据时提醒覆盖
    var local = D.read();
    var localCount = Object.keys(local.items).length;
    var incomingCount = Object.keys(data.items).length;

    var rows = [];
    Object.keys(data.items).forEach(function (k) {
      var def = D.PART_MAP[k];
      if (!def) return;
      var it = data.items[k];
      var txt;
      if (def.unit === "wt") {
        var kg = it.v * (D.WT_FACTOR[it.u] || 1);
        txt = D.fmt(kg) + " 公斤（" + D.fmt(kg / 0.5) + " 斤）";
      } else {
        var cm = it.v * (D.LEN_FACTOR[it.u] || 1);
        txt = D.fmt(cm) + " cm";
      }
      rows.push("<tr><td>" + def.t + "</td><td>" + txt + "</td></tr>");
    });

    app.innerHTML =
      '<div class="card">' +
        '<h2>链接里有 ' + incomingCount + ' 项数据</h2>' +
        '<p class="hint">' +
          (localCount > 0
            ? '这台设备已经有 <b>' + localCount + ' 项</b>数据，导入会<b>整体覆盖</b>掉。'
            : '这台设备还没有数据，可以直接导入。') +
        '</p>' +
        '<table class="res"><thead><tr><th>部位</th><th>数值</th></tr></thead>' +
        '<tbody>' + rows.join("") + '</tbody></table>' +
        '<div class="btnrow">' +
          '<button class="btn brand" id="doImport">导入到本机</button>' +
          '<a class="btn ghost" href="profile.html">先不导入</a>' +
        '</div>' +
        '<div class="note-box mid" style="margin-top:14px">' +
          '<b>提醒：</b>这条链接等同于你的身体数据。别人拿到也能看到，' +
          '所以别发到公开群或朋友圈。用完可以让对方删掉那条消息。' +
        '</div>' +
      '</div>';

    document.getElementById("doImport").addEventListener("click", function () {
      D.clearAll();
      // 按顺序写入，保留各自的单位
      Object.keys(data.items).forEach(function (k) {
        var it = data.items[k];
        D.setItem(k, it.v, it.u);
      });
      D.setUnit("len", data.units.len);
      D.setUnit("wt", data.units.wt);
      if (data.prefs && data.prefs.fabric) D.setPref("fabric", data.prefs.fabric);
      UIx.toast("导入成功");
      setTimeout(function () { location.href = "profile.html#imported"; }, 500);
    });
  }

  UIx.boot();
  render(data);
})();
</script>
</body>
</html>
